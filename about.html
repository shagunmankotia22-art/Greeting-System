<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0,user-scalable=no">
  <title>About | Greetings</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <script src="script.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap"
    rel="stylesheet">
  <style>
    #about-section {
      min-height: calc(100vh - 120px);
      background: #0a0812;
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }

    #about-section::before {
      content: '';
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse 60% 50% at 20% 50%, rgba(139, 92, 246, .18), transparent),
        radial-gradient(ellipse 60% 50% at 80% 50%, rgba(236, 72, 153, .13), transparent);
      pointer-events: none;
    }

    #particles {
      position: absolute;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
    }

    .star {
      position: absolute;
      border-radius: 50%;
      background: #fff;
      animation: twinkle var(--d, 3s) var(--delay, 0s) infinite alternate;
    }

    @keyframes twinkle {
      0% {
        opacity: .1;
        transform: scale(.8)
      }

      100% {
        opacity: .7;
        transform: scale(1.2)
      }
    }

    .about-inner {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 780px;
    }

    /* TEAM CARDS */
    #teamView {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 36px;
    }

    .team-heading {
      text-align: center;
    }

    .team-heading h1 {
      font-size: 32px;
      font-weight: 800;
      background: linear-gradient(135deg, #c4b5fd, #f472b6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 10px;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    .team-heading p {
      color: rgba(160, 157, 192, .7);
      font-size: 13px;
      letter-spacing: 3px;
      text-transform: uppercase;
    }

    .cards-row {
      display: flex;
      gap: 28px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .member-card {
      width: 240px;
      background: rgba(255, 255, 255, .05);
      border: 1px solid rgba(255, 255, 255, .1);
      border-radius: 24px;
      padding: 32px 22px 24px;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      transition: transform .35s ease, border-color .3s, box-shadow .3s;
      backdrop-filter: blur(12px);
    }

    .member-card:hover {
      transform: translateY(-8px);
      border-color: rgba(167, 139, 250, .5);
      box-shadow: 0 20px 60px rgba(139, 92, 246, .2);
    }

    .member-card.tanvee:hover {
      border-color: rgba(244, 114, 182, .5);
      box-shadow: 0 20px 60px rgba(236, 72, 153, .2);
    }

    .member-card::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(167, 139, 250, .07), rgba(236, 72, 153, .05));
      pointer-events: none;
    }

    .glow-orb {
      position: absolute;
      top: -30px;
      right: -30px;
      width: 100px;
      height: 100px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(167, 139, 250, .25), transparent);
      pointer-events: none;
    }

    .tanvee .glow-orb {
      background: radial-gradient(circle, rgba(244, 114, 182, .25), transparent);
    }

    .m-avatar {
      width: 76px;
      height: 76px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 30px;
      font-weight: 800;
      margin: 0 auto 18px;
      border: 2px solid rgba(255, 255, 255, .15);
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    .shagun .m-avatar {
      background: linear-gradient(135deg, #6d28d9, #a78bfa);
      color: #fff;
    }

    .tanvee .m-avatar {
      background: linear-gradient(135deg, #9d174d, #f472b6);
      color: #fff;
    }

    .m-name {
      font-size: 20px;
      font-weight: 700;
      color: #f3e8ff;
      text-align: center;
      margin-bottom: 4px;
    }

    .m-role {
      font-size: 11px;
      color: rgba(160, 157, 192, .7);
      text-align: center;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 22px;
    }

    .m-open-btn {
      width: 100%;
      padding: 11px;
      border-radius: 12px;
      border: 1px solid rgba(167, 139, 250, .4);
      background: rgba(167, 139, 250, .1);
      color: #c4b5fd;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background .2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .tanvee .m-open-btn {
      border-color: rgba(244, 114, 182, .4);
      background: rgba(244, 114, 182, .1);
      color: #f9a8d4;
    }

    .m-open-btn:hover {
      background: rgba(167, 139, 250, .22);
    }

    .tanvee .m-open-btn:hover {
      background: rgba(244, 114, 182, .22);
    }

    .hint-text {
      color: rgba(160, 157, 192, .45);
      font-size: 12px;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    /* NOTEBOOK */
    #notebookView {
      display: none;
      width: 100%;
    }

    .nb-back {
      background: none;
      border: 1px solid rgba(255, 255, 255, .1);
      color: rgba(160, 157, 192, .7);
      padding: 8px 18px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 13px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 24px;
      transition: color .2s, border-color .2s;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    .nb-back:hover {
      color: #f3e8ff;
      border-color: rgba(255, 255, 255, .25);
    }

    .notebook {
      display: flex;
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 40px 100px rgba(0, 0, 0, .7), 0 0 0 1px rgba(255, 255, 255, .06);
      min-height: 430px;
    }

    .nb-spine {
      width: 34px;
      flex-shrink: 0;
      background: linear-gradient(to bottom, #1a0d3d, #2a1560);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 18px 0;
      gap: 14px;
      border-right: 1px solid rgba(255, 255, 255, .07);
    }

    .ring {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      border: 2.5px solid rgba(255, 255, 255, .18);
      background: rgba(255, 255, 255, .04);
    }

    .nb-sidebar {
      width: 54px;
      flex-shrink: 0;
      background: #110926;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 0;
      gap: 6px;
      border-right: 1px solid rgba(255, 255, 255, .05);
    }

    .nav-tab {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      border: none;
      background: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 17px;
      transition: background .2s;
      position: relative;
    }

    .nav-tab.active {
      background: rgba(167, 139, 250, .2);
    }

    .nav-tab:hover:not(.active) {
      background: rgba(255, 255, 255, .05);
    }

    .tip {
      position: absolute;
      left: 48px;
      background: #1e1040;
      color: #c4b5fd;
      font-size: 11px;
      padding: 4px 9px;
      border-radius: 6px;
      white-space: nowrap;
      opacity: 0;
      pointer-events: none;
      transition: opacity .15s;
      border: 1px solid rgba(167, 139, 250, .25);
      font-family: 'Plus Jakarta Sans', sans-serif;
      z-index: 10;
    }

    .nav-tab:hover .tip {
      opacity: 1;
    }

    .nb-content {
      flex: 1;
      background: #160f2e;
      overflow: hidden;
    }

    .nb-page {
      display: none;
      padding: 28px 24px;
      flex-direction: column;
      gap: 14px;
      min-height: 430px;
    }

    .nb-page.active {
      display: flex;
    }

    .page-hero {
      display: flex;
      gap: 16px;
      align-items: flex-start;
    }

    .hero-photo {
      width: 82px;
      height: 104px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 38px;
      font-weight: 800;
      color: #fff;
      flex-shrink: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    .s-photo {
      background: linear-gradient(135deg, #5b21b6, #8b5cf6);
    }

    .t-photo {
      background: linear-gradient(135deg, #9d174d, #ec4899);
    }

    .hero-greeting {
      font-size: 11px;
      color: #a78bfa;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 4px;
    }

    .t-greeting {
      color: #f472b6;
    }

    .hero-name {
      font-size: 20px;
      font-weight: 700;
      color: #f3e8ff;
      margin-bottom: 3px;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    .hero-role {
      font-size: 11px;
      color: rgba(160, 157, 192, .6);
      margin-bottom: 10px;
    }

    .hero-bio {
      font-size: 12.5px;
      color: rgba(160, 157, 192, .85);
      line-height: 1.65;
    }

    .hero-sig {
      font-size: 17px;
      color: rgba(255, 255, 255, .22);
      margin-top: 8px;
      font-style: italic;
    }

    .sec-label {
      font-size: 10px;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: rgba(160, 157, 192, .5);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .sec-label::after {
      content: '';
      flex: 1;
      height: 1px;
      background: rgba(255, 255, 255, .07);
    }

    .detail-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 7px;
    }

    .det-row {
      display: flex;
      flex-direction: column;
      gap: 2px;
      padding: 8px 10px;
      background: rgba(255, 255, 255, .04);
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, .05);
    }

    .det-label {
      font-size: 10px;
      color: rgba(160, 157, 192, .5);
    }

    .det-val {
      font-size: 12px;
      color: #f3e8ff;
      font-weight: 600;
    }

    .quote-box {
      background: rgba(124, 58, 237, .08);
      border-left: 3px solid #7c3aed;
      border-radius: 0 10px 10px 0;
      padding: 12px 14px;
      font-size: 13px;
      color: #c4b5fd;
      font-style: italic;
      line-height: 1.6;
    }

    .t-quote {
      background: rgba(190, 24, 93, .08);
      border-left-color: #be185d;
      color: #f9a8d4;
    }

    .skill-item {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .skill-top {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
    }

    .skill-name {
      color: #f3e8ff;
      font-weight: 500;
    }

    .skill-pct {
      color: rgba(160, 157, 192, .6);
    }

    .skill-track {
      height: 5px;
      background: rgba(255, 255, 255, .07);
      border-radius: 3px;
      overflow: hidden;
    }

    .skill-fill {
      height: 100%;
      border-radius: 3px;
      background: linear-gradient(to right, #6d28d9, #a78bfa);
      width: 0;
      transition: width .9s cubic-bezier(.4, 0, .2, 1);
    }

    .t-fill {
      background: linear-gradient(to right, #9d174d, #f472b6);
    }

    .tech-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .tech-tag {
      font-size: 11px;
      padding: 3px 10px;
      border-radius: 20px;
      border: 1px solid rgba(167, 139, 250, .3);
      color: #c4b5fd;
      background: rgba(167, 139, 250, .08);
    }

    .t-tag {
      border-color: rgba(244, 114, 182, .3);
      color: #f9a8d4;
      background: rgba(244, 114, 182, .08);
    }

    .timeline {
      display: flex;
      flex-direction: column;
    }

    .tl-item {
      display: flex;
      gap: 12px;
    }

    .tl-left {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .tl-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #7c3aed;
      flex-shrink: 0;
      margin-top: 5px;
    }

    .t-dot {
      background: #be185d;
    }

    .tl-line {
      width: 2px;
      flex: 1;
      background: rgba(255, 255, 255, .07);
      margin: 5px 0;
      min-height: 20px;
    }

    .tl-right {
      flex: 1;
      padding-bottom: 18px;
    }

    .tl-year {
      font-size: 10px;
      color: rgba(160, 157, 192, .5);
      letter-spacing: 1px;
      margin-bottom: 3px;
    }

    .tl-title {
      font-size: 13px;
      font-weight: 600;
      color: #f3e8ff;
      margin-bottom: 4px;
    }

    .tl-desc {
      font-size: 12px;
      color: rgba(160, 157, 192, .75);
      line-height: 1.6;
    }

    .proj-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .proj-card {
      background: rgba(255, 255, 255, .04);
      border: 1px solid rgba(255, 255, 255, .07);
      border-radius: 12px;
      padding: 14px;
    }

    .proj-icon {
      font-size: 22px;
      margin-bottom: 8px;
    }

    .proj-name {
      font-size: 13px;
      font-weight: 600;
      color: #f3e8ff;
      margin-bottom: 5px;
    }

    .proj-desc {
      font-size: 11px;
      color: rgba(160, 157, 192, .7);
      line-height: 1.5;
      margin-bottom: 8px;
    }

    .proj-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
    }

    .proj-tag {
      font-size: 10px;
      padding: 2px 7px;
      border-radius: 6px;
      background: rgba(167, 139, 250, .1);
      color: #c4b5fd;
      border: 1px solid rgba(167, 139, 250, .2);
    }

    .t-ptag {
      background: rgba(244, 114, 182, .1);
      color: #f9a8d4;
      border-color: rgba(244, 114, 182, .2);
    }

    .contact-items {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .contact-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 11px 14px;
      background: rgba(255, 255, 255, .04);
      border: 1px solid rgba(255, 255, 255, .06);
      border-radius: 12px;
    }

    .c-icon {
      width: 34px;
      height: 34px;
      border-radius: 9px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      background: rgba(167, 139, 250, .15);
    }

    .t-icon {
      background: rgba(244, 114, 182, .15);
    }

    .c-label {
      font-size: 10px;
      color: rgba(160, 157, 192, .5);
    }

    .c-val {
      font-size: 12.5px;
      color: #f3e8ff;
      font-weight: 500;
    }

    @media (max-width:640px) {
      .cards-row {
        flex-direction: column;
        align-items: center;
      }

      .member-card {
        width: 100%;
        max-width: 300px;
      }

      .nb-spine {
        display: none;
      }

      .nb-sidebar {
        width: 100%;
        flex-direction: row;
        height: 50px;
        justify-content: center;
        padding: 0;
        border-right: none;
        border-bottom: 1px solid rgba(255, 255, 255, .05);
      }

      .tip {
        display: none;
      }

      .detail-grid {
        grid-template-columns: 1fr;
      }

      .proj-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>

</head>

      function renderNotebook(person) {
        var d = profiles[person];
        var h = '';

        /* About */
        h += '<div class="nb-page active" id="page-about">';
        h += '<div class="page-hero"><div class="hero-photo ' + d.photoClass + '">' + d.letter + '</div><div class="hero-text">';

        h += '<div class="quote-box ' + d.quoteClass + '">' + d.quote + '</div>';
        h += '<div class="sec-label">Details</div><div class="detail-grid">';
        d.details.forEach(function (x) { h += '<div class="det-row"><div class="det-label">' + x.l + '</div><div class="det-val">' + x.v + '</div></div>'; });
        h += '</div></div>';

        /* Skills */
        h += '<div class="nb-page" id="page-skills"><div class="sec-label">Technical Skills</div>';
        d.skills.forEach(function (s) { h += '<div class="skill-item"><div class="skill-top"><span class="skill-name">' + s.n + '</span><span class="skill-pct">' + s.p + '%</span></div><div class="skill-track"><div class="skill-fill ' + s.cls + '" data-w="' + s.p + '"></div></div></div>'; });
        h += '<div class="sec-label" style="margin-top:6px">Technologies</div><div class="tech-row">';
        d.tech.forEach(function (t) { h += '<span class="tech-tag ' + d.techCls + '">' + t + '</span>'; });
        h += '</div></div>';

        /* Experience */
        h += '<div class="nb-page" id="page-experience"><div class="sec-label">Journey</div><div class="timeline">';
        d.exp.forEach(function (e, i) {
          h += '<div class="tl-item"><div class="tl-left"><div class="tl-dot ' + d.dotCls + '"></div>';
          if (i < d.exp.length - 1) h += '<div class="tl-line"></div>';
          h += '</div><div class="tl-right"><div class="tl-year">' + e.y + '</div><div class="tl-title">' + e.t + '</div><div class="tl-desc">' + e.d + '</div></div></div>';
        });
        h += '</div></div>';

        /* Projects */
        h += '<div class="nb-page" id="page-projects"><div class="sec-label">Projects</div><div class="proj-grid">';
        d.projects.forEach(function (pr) {
          h += '<div class="proj-card"><div class="proj-icon">' + pr.icon + '</div><div class="proj-name">' + pr.n + '</div><div class="proj-desc">' + pr.d + '</div><div class="proj-tags">';
          pr.tags.forEach(function (tg) { h += '<span class="proj-tag ' + pr.tc + '">' + tg + '</span>'; });
          h += '</div></div>';
        });
        h += '</div></div>';

        d.contacts.forEach(function (c) { h += '<div class="contact-item"><div class="c-icon ' + c.ic + '">' + c.icon + '</div><div><div class="c-label">' + c.l + '</div><div class="c-val">' + c.v + '</div></div></div>'; });

      };

      window.closeNotebook = function () {
        document.getElementById('notebookView').style.display = 'none';

      };

      window.switchTab = function (name) {
        document.querySelectorAll('.nb-page').forEach(function (pg) { pg.classList.remove('active'); });
        document.querySelectorAll('.nav-tab').forEach(function (t) { t.classList.toggle('active', t.dataset.tab === name); });
        var pg = document.getElementById('page-' + name);
        if (pg) { pg.classList.add('active'); if (name === 'skills') setTimeout(animateBars, 60); }
      };

      function animateBars() {
        document.querySelectorAll('.skill-fill').forEach(function (bar) { bar.style.width = bar.dataset.w + '%'; });

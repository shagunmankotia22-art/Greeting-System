<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    body.auth-page {
      min-height: 100vh;
      overflow-y: auto !important;
      background: transparent !important;
    }
    canvas#space-bg {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
    }
    .auth-container {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .auth-card {
      width: 100%;
      max-width: 420px;
      max-height: 90vh;
      overflow-y: auto;
      scrollbar-width: thin;
      scrollbar-color: rgba(124,58,237,0.4) transparent;
    }
    .auth-card::-webkit-scrollbar { width: 4px; }
    .auth-card::-webkit-scrollbar-thumb { background: rgba(124,58,237,0.4); border-radius: 4px; }
  </style>
</head>
<body class="auth-page">

<canvas id="space-bg"></canvas>

  <div class="auth-container">
    <div class="auth-card">

      <div class="auth-header">
        <a href="index.html">
          <img src="logo.svg" alt="Greetings Logo" style="height:100px;width:auto;display:block;margin:0 auto 8px;">
        </a>
        <h2>Welcome</h2>
        <p>Login to continue</p>
      </div>

      <div class="input-group">
        <label>Email <span style="color:#ff4d6d">*</span></label>
        <input type="email" id="loginEmail" placeholder="name@example.com" required>
      </div>

      <div class="input-group" style="position:relative;">
        <label>Password <span style="color:#ff4d6d">*</span></label>
        <input type="password" id="loginPassword" placeholder="Enter your password" required style="padding-right:45px;">
        <span id="toggleLoginPass" style="position:absolute;right:14px;bottom:13px;cursor:pointer;font-size:1.2rem;color:#aaa;">👁️</span>
      </div>

      <div class="remember-row">
        <label class="remember-label">
          <input type="checkbox" id="rememberMe">
          <span class="remember-box">
            <svg viewBox="0 0 12 10" fill="none" xmlns="http://www.w3.org/2000/svg">
              <polyline points="1,5 4.5,8.5 11,1" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </span>
          Remember me
        </label>
        <div class="forgot" style="margin:0;">
          <a href="#" class="forgot-link" style="color:#7c3aed;font-weight:600;">Forgot password?</a>
        </div>
      </div>

      <button id="loginBtn" class="auth-btn">Log in</button>

      <div class="auth-footer">
        <p>Don't have an account?
          <a href="signup.html" style="color:#7c3aed;font-weight:700;">Sign up</a>
        </p>
      </div>

      <div style="text-align:center;margin-top:15px;font-size:0.78rem;color:#666;line-height:1.6;">
        By signing in, I accept Greetings'<br>
        <a href="#" style="color:#aaa;text-decoration:underline;">Terms of Use</a>
        &amp;
        <a href="#" style="color:#aaa;text-decoration:underline;">Privacy Policy</a>
      </div>

    </div>
  </div>

<script>
(function(){
  const cv = document.getElementById('space-bg');
  const cx = cv.getContext('2d');
  let W, H;

  function resize() { W = cv.width = window.innerWidth; H = cv.height = window.innerHeight; }
  resize();
  window.addEventListener('resize', resize);

  const COLORS = ['#ffffff','#cce0ff','#d4b8ff','#b8d4ff','#e0d0ff'];
  const stars = Array.from({length:350}, () => ({
    x: Math.random() * 9999, y: Math.random() * 9999,
    r: Math.random() * 1.5 + 0.2,
    twinkle: Math.random() * Math.PI * 2,
    ts: Math.random() * 0.025 + 0.005,
    b: Math.random() * 0.6 + 0.4,
    col: COLORS[Math.floor(Math.random() * COLORS.length)],
    cross: Math.random() < 0.25
  }));

  const dust = Array.from({length:80}, () => ({
    x: Math.random() * 9999, y: Math.random() * 9999,
    r: Math.random() * 3 + 1,
    op: Math.random() * 0.14 + 0.03,
    hue: Math.random() < 0.5 ? 215 + Math.random() * 25 : 265 + Math.random() * 25
  }));

  const NEBULAE = [
    {nx:.30, ny:.35, rx:.22, ry:.18, hue:220, alpha:.045},
    {nx:.70, ny:.60, rx:.20, ry:.16, hue:260, alpha:.038},
    {nx:.50, ny:.55, rx:.25, ry:.15, hue:195, alpha:.032},
    {nx:.20, ny:.55, rx:.16, ry:.14, hue:240, alpha:.028},
    {nx:.80, ny:.40, rx:.15, ry:.13, hue:280, alpha:.025},
  ];

  const PLANET = {nx:.84, ny:.14, r:52};
  let shooters = [], nextShoot = 3, t = 0;

  function mkShooter() {
    return {x:-80, y:Math.random()*H*.55, vx:Math.random()*7+5, vy:Math.random()*2+.4, len:Math.random()*130+60, alpha:0};
  }

  function drawPlanet(px, py) {
    const g = cx.createRadialGradient(px-16, py-16, 5, px, py, PLANET.r);
    g.addColorStop(0,'#1a3570'); g.addColorStop(.55,'#0c1c48'); g.addColorStop(1,'#040c22');
    cx.beginPath(); cx.arc(px, py, PLANET.r, 0, Math.PI*2); cx.fillStyle = g; cx.fill();

    cx.save(); cx.beginPath(); cx.arc(px, py, PLANET.r, 0, Math.PI*2); cx.clip();
    ['rgba(30,70,160,0.38)','rgba(20,55,120,0.28)','rgba(15,38,90,0.32)'].forEach((col,i) => {
      cx.beginPath(); cx.ellipse(px-6+i*7, py-8+i*14, PLANET.r*.85, PLANET.r*.17, -.18+i*.12, 0, Math.PI*2);
      cx.fillStyle = col; cx.fill();
    }); cx.restore();

    const rim = cx.createLinearGradient(px-PLANET.r, py-PLANET.r, px+PLANET.r, py+PLANET.r);
    rim.addColorStop(0,'rgba(80,150,255,0.3)'); rim.addColorStop(1,'rgba(20,60,180,0.05)');
    cx.beginPath(); cx.arc(px, py, PLANET.r, 0, Math.PI*2); cx.strokeStyle = rim; cx.lineWidth = 2.5; cx.stroke();

    cx.save(); cx.globalAlpha = .7;
    cx.beginPath(); cx.ellipse(px, py+9, PLANET.r*1.75, PLANET.r*.34, -.16, 0, Math.PI*2);
    const rg = cx.createLinearGradient(px-PLANET.r*1.75, py, px+PLANET.r*1.75, py);
    rg.addColorStop(0,'rgba(40,100,220,0)'); rg.addColorStop(.3,'rgba(50,120,255,.22)');
    rg.addColorStop(.5,'rgba(70,140,255,.35)'); rg.addColorStop(.7,'rgba(50,120,255,.22)');
    rg.addColorStop(1,'rgba(40,100,220,0)');
    cx.strokeStyle = rg; cx.lineWidth = 8; cx.stroke();
    cx.globalAlpha = 1; cx.restore();

    cx.save();
    cx.beginPath(); cx.arc(px, py, PLANET.r, 0, Math.PI*2);
    cx.fillStyle = 'rgba(4,12,34,0.55)'; cx.fill();
    cx.restore();
  }

  function frame() {
    t += .016;
    cx.clearRect(0, 0, W, H);

    const bg = cx.createLinearGradient(0, 0, W*.25, H);
    bg.addColorStop(0,'#00000f'); bg.addColorStop(.45,'#020818'); bg.addColorStop(1,'#000510');
    cx.fillStyle = bg; cx.fillRect(0, 0, W, H);

    NEBULAE.forEach(n => {
      const px=n.nx*W, py=n.ny*H, rmax=Math.max(n.rx*W, n.ry*H);
      const g = cx.createRadialGradient(px, py, 0, px, py, rmax);
      g.addColorStop(0, `hsla(${n.hue},85%,55%,${n.alpha*1.8})`);
      g.addColorStop(.5, `hsla(${n.hue},80%,48%,${n.alpha})`);
      g.addColorStop(1, 'transparent');
      cx.save(); cx.translate(px,py); cx.scale(n.rx*W/rmax, n.ry*H/rmax); cx.translate(-px,-py);
      cx.fillStyle = g; cx.fillRect(0,0,W,H); cx.restore();
    });

    dust.forEach(d => {
      cx.beginPath(); cx.arc(d.x%W, d.y%H, d.r, 0, Math.PI*2);
      cx.fillStyle = `hsla(${d.hue},55%,70%,${d.op})`; cx.fill();
    });

    stars.forEach(s => {
      s.twinkle += s.ts;
      const a = s.b * (0.45 + 0.55 * Math.abs(Math.sin(s.twinkle)));
      const r = s.r * (0.75 + 0.35 * Math.abs(Math.sin(s.twinkle * 1.4)));
      const sx = s.x % W, sy = s.y % H;
      cx.globalAlpha = a;
      cx.beginPath(); cx.arc(sx, sy, r, 0, Math.PI*2); cx.fillStyle = s.col; cx.fill();
      if (s.cross && r > 1 && a > .7) {
        cx.strokeStyle = s.col; cx.lineWidth = .45;
        const fl = r * 4.5;
        cx.beginPath(); cx.moveTo(sx-fl, sy); cx.lineTo(sx+fl, sy); cx.stroke();
        cx.beginPath(); cx.moveTo(sx, sy-fl); cx.lineTo(sx, sy+fl); cx.stroke();
      }
      cx.globalAlpha = 1;
    });

    drawPlanet(PLANET.nx * W, PLANET.ny * H);

    if (t > nextShoot) { shooters.push(mkShooter()); nextShoot = t + Math.random()*6 + 3; }
    shooters = shooters.filter(s => {
      s.x += s.vx; s.y += s.vy; s.alpha = Math.min(1, s.alpha + .07);
      if (s.x > W + 120) return false;
      const tx = s.x - s.vx*(s.len/s.vx), ty = s.y - s.vy*(s.len/s.vx);
      const sg = cx.createLinearGradient(tx, ty, s.x, s.y);
      sg.addColorStop(0,'transparent'); sg.addColorStop(.7,`rgba(150,205,255,${s.alpha*.28})`);
      sg.addColorStop(1,`rgba(220,240,255,${s.alpha*.8})`);
      cx.strokeStyle = sg; cx.lineWidth = 1.3;
      cx.beginPath(); cx.moveTo(tx,ty); cx.lineTo(s.x,s.y); cx.stroke();
      cx.beginPath(); cx.arc(s.x, s.y, 1.3, 0, Math.PI*2);
      cx.fillStyle = `rgba(240,248,255,${s.alpha})`; cx.fill();
      return true;
    });

    requestAnimationFrame(frame);
  }
  frame();
})();
</script>

  <script src="api.js"></script>
  <script src="auth.js"></script>
  <script src="nav-auth.js"></script>
  <script>
    const toggleLoginPass = document.getElementById('toggleLoginPass');
    const loginPassword   = document.getElementById('loginPassword');
    toggleLoginPass.addEventListener('click', () => {
      if (loginPassword.type === 'password') {
        loginPassword.type = 'text';
        toggleLoginPass.textContent = '🙈';
      } else {
        loginPassword.type = 'password';
        toggleLoginPass.textContent = '👁️';
      }
    });

    const emailInput    = document.getElementById('loginEmail');
    const rememberCheck = document.getElementById('rememberMe');
    const REMEMBER_KEY  = 'greetings_remember_email';

    const savedEmail = localStorage.getItem(REMEMBER_KEY);
    if (savedEmail) { emailInput.value = savedEmail; rememberCheck.checked = true; }

    document.getElementById('loginBtn').addEventListener('click', () => {
      const email = emailInput.value.trim();
      if (rememberCheck.checked && email) {
        localStorage.setItem(REMEMBER_KEY, email);
      } else {
        localStorage.removeItem(REMEMBER_KEY);
      }
    });

    document.querySelector('.forgot-link').addEventListener('click', (e) => {
      e.preventDefault();
      const email = emailInput.value.trim();
      if (!email) { alert('📧 Please enter your email first, then click Forgot Password.'); return; }
      alert('✅ Password reset link sent to: ' + email);
    });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    body.auth-page {
      min-height: 100vh;
      overflow-y: auto !important;
    }
    .auth-container {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .auth-card {
      width: 100%;
      max-width: 420px;
      max-height: 90vh;
      overflow-y: auto;
      scrollbar-width: thin;
      scrollbar-color: rgba(124,58,237,0.4) transparent;
    }
    .auth-card::-webkit-scrollbar { width: 4px; }
    .auth-card::-webkit-scrollbar-thumb { background: rgba(124,58,237,0.4); border-radius: 4px; }
  </style>
</head>
<body class="auth-page">

  <div class="auth-container">
    <div class="auth-card">

      <div class="auth-header">
        <a href="index.html">
          <img src="logo.svg" alt="Greetings Logo" style="height:100px;width:auto;display:block;margin:0 auto 8px;">
        </a>
        <h2>Welcome</h2>
        <p>Login to continue</p>
      </div>

      <div class="input-group">
        <label>Email <span style="color:#ff4d6d">*</span></label>
        <input type="email" id="loginEmail" placeholder="name@example.com" required>
      </div>

      <div class="input-group" style="position:relative;">
        <label>Password <span style="color:#ff4d6d">*</span></label>
        <input type="password" id="loginPassword" placeholder="Enter your password" required style="padding-right:45px;">
        <span id="toggleLoginPass" style="position:absolute;right:14px;bottom:13px;cursor:pointer;font-size:1.2rem;color:#aaa;">👁️</span>
      </div>

      <div class="remember-row">
        <label class="remember-label">
          <input type="checkbox" id="rememberMe">
          <span class="remember-box">
            <svg viewBox="0 0 12 10" fill="none" xmlns="http://www.w3.org/2000/svg">
              <polyline points="1,5 4.5,8.5 11,1" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </span>
          Remember me
        </label>
        <div class="forgot" style="margin:0;">
          <a href="#" style="color:#7c3aed;font-weight:600;">Forgot password?</a>
        </div>
      </div>

      <button id="loginBtn" class="auth-btn">Log in</button>

      <div class="auth-footer">
        <p>Don't have an account?
          <a href="signup.html" style="color:#7c3aed;font-weight:700;">Sign up</a>
        </p>
      </div>

      <div style="text-align:center;margin-top:15px;font-size:0.78rem;color:#666;line-height:1.6;">
        By signing in, I accept Greetings'<br>
        <a href="#" style="color:#aaa;text-decoration:underline;">Terms of Use</a>
        &amp;
        <a href="#" style="color:#aaa;text-decoration:underline;">Privacy Policy</a>
      </div>

    </div>
  </div>

  <script src="api.js"></script>
  <script src="auth.js"></script>
  <script src="nav-auth.js"></script>
  <script>
    const toggleLoginPass = document.getElementById('toggleLoginPass');
    const loginPassword   = document.getElementById('loginPassword');
    toggleLoginPass.addEventListener('click', () => {
      if (loginPassword.type === 'password') {
        loginPassword.type = 'text';
        toggleLoginPass.textContent = '🙈';
      } else {
        loginPassword.type = 'password';
        toggleLoginPass.textContent = '👁️';
      }
    });

    const emailInput    = document.getElementById('loginEmail');
    const rememberCheck = document.getElementById('rememberMe');
    const REMEMBER_KEY  = 'greetings_remember_email';

    const savedEmail = localStorage.getItem(REMEMBER_KEY);
    if (savedEmail) { emailInput.value = savedEmail; rememberCheck.checked = true; }

    document.getElementById('loginBtn').addEventListener('click', () => {
      const email = emailInput.value.trim();
      if (rememberCheck.checked && email) {
        localStorage.setItem(REMEMBER_KEY, email);
      } else {
        localStorage.removeItem(REMEMBER_KEY);
      }
    });

    document.querySelector('.forgot a').addEventListener('click', (e) => {
      e.preventDefault();
      const email = emailInput.value.trim();
      if (!email) { alert('📧 Please enter your email first, then click Forgot Password.'); return; }
      alert('✅ Password reset link sent to: ' + email);
    });
  </script>
</body>
</html>

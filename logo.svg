<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 320">
  <defs>
    <linearGradient id="grad-main" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff4d6d"/>
      <stop offset="50%" stop-color="#c026d3"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="grad-ribbon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff4d6d"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
  </defs>

  <!-- Decorative envelope background shape -->
  <g opacity="0.08">
    <rect x="220" y="60" width="240" height="180" rx="12" fill="url(#grad-main)"/>
    <path d="M220 72 L340 155 L460 72" fill="none" stroke="#c026d3" stroke-width="2"/>
  </g>

  <!-- Floating petals / confetti -->
  <ellipse cx="155" cy="120" rx="18" ry="8" fill="#ff4d6d" opacity="0.25" transform="rotate(-35 155 120)"/>
  <ellipse cx="530" cy="100" rx="14" ry="6" fill="#7c3aed" opacity="0.25" transform="rotate(25 530 100)"/>
  <ellipse cx="570" cy="200" rx="10" ry="5" fill="#f97316" opacity="0.3" transform="rotate(-15 570 200)"/>
  <ellipse cx="120" cy="210" rx="12" ry="5" fill="#c026d3" opacity="0.25" transform="rotate(20 120 210)"/>
  <circle cx="175" cy="185" r="5" fill="#ff4d6d" opacity="0.3"/>
  <circle cx="510" cy="165" r="4" fill="#7c3aed" opacity="0.3"/>
  <circle cx="545" cy="130" r="3" fill="#f97316" opacity="0.35"/>
  <circle cx="140" cy="148" r="3" fill="#c026d3" opacity="0.3"/>

  <!-- Sparkle stars -->
  <polygon points="200,80 203,90 213,90 205,96 208,106 200,100 192,106 195,96 187,90 197,90"
    fill="#ff4d6d" opacity="0.5" transform="scale(0.5) translate(200,50)"/>
  <polygon points="460,70 462,77 469,77 463,81 466,88 460,84 454,88 457,81 451,77 458,77"
    fill="#7c3aed" opacity="0.45" transform="scale(0.6) translate(300,40)"/>
  <polygon points="560,180 562,187 569,187 563,191 566,198 560,194 554,198 557,191 551,187 558,187"
    fill="#f97316" opacity="0.4" transform="scale(0.55) translate(440,120)"/>

  <!-- Main logotype -->
  <text x="340" y="178" text-anchor="middle"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="82" font-weight="700" letter-spacing="-2"
    fill="url(#grad-main)">Greetings</text>

  <!-- Underline ribbon -->
  <rect x="180" y="195" width="320" height="5" rx="3" fill="url(#grad-ribbon)" opacity="0.85"/>

  <!-- Tagline -->
  <text x="340" y="232" text-anchor="middle"
    font-family="'Helvetica Neue', Arial, sans-serif"
    font-size="14" font-weight="400" letter-spacing="5"
    fill="#c026d3" opacity="0.75">SEND LOVE. SHARE JOY.</text>

  <!-- Heart accent -->
  <path d="M322 248 C322 245 319 242 316 244 C313 246 313 250 316 253 L322 259 L328 253 C331 250 331 246 328 244 C325 242 322 245 322 248Z"
    fill="#ff4d6d" opacity="0.7"/>
</svg>
